[SERVICE]
    Flush        2
    Daemon       Off
    Log_Level    info

# Linux-specific inputs
[INPUT]
    Name         tail
    Path         /var/log/auth.log
    Tag          linux
    Read_from_Head true
    DB           /var/log/fluent-bit-linux.db

[INPUT]
    Name         tail
    Path         /var/log/apache2/access.log
    Tag          apache
    Read_from_Head true
    DB           /var/log/fluent-bit-apache.db

# Windows Event Log (when running on Windows)
[INPUT]
    Name         winevtlog
    Channel      Security
    Tag          windows
    Read_from_Head true
    DB           /var/log/fluent-bit-windows.db

# Palo Alto syslog
[INPUT]
    Name         syslog
    Mode         udp
    Port         5140
    Tag          paloalto
    Listen       0.0.0.0

# AWS CloudTrail (file watch)
[INPUT]
    Name         tail
    Path         /var/log/cloudtrail/*.json
    Tag          aws
    Read_from_Head true
    Skip_Long_Lines On
    DB           /var/log/fluent-bit-aws.db

# Output to Cyber-Shield receiver
[OUTPUT]
    Name         http
    Match_Regex  (apache|linux|windows|paloalto|aws)
    Host         127.0.0.1
    Port         5000
    URI          /ingest/${Tag}
    Format       json
    Header       X-API-Key change-me-secret
    Header       X-Host-Name ${HOSTNAME}