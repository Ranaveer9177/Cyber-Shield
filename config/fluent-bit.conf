[SERVICE]
    Flush        2
    Daemon       Off
    Log_Level    info

# ============================================================
# LOCAL MODE: runs on the laptop / SIEM server
# Tails local log files and POSTs to localhost:5000
#
# Note on Offset Tracking (DB directive):
# Setting 'DB /var/log/fluent-bit-offsets.db' ensures Fluent Bit
# records file read positions so it does not re-read from line 1
# on every restart, even with Read_from_Head true on initial run.
# ============================================================

# --- Apache access log (local) ---
[INPUT]
    Name         tail
    Path         /var/log/apache2/access.log
    Tag          apache
    Read_from_Head true
    DB           /var/log/fluent-bit-apache.db

# --- Linux auth log (local) ---
[INPUT]
    Name         tail
    Path         /var/log/auth.log
    Tag          linux
    Read_from_Head true
    DB           /var/log/fluent-bit-linux.db

# --- AWS CloudTrail JSON (local watch folder) ---
# Watches a local directory where CloudTrail JSON files are downloaded.
[INPUT]
    Name         tail
    Path         /var/log/cloudtrail/*.json
    Tag          aws
    Read_from_Head true
    Skip_Long_Lines On
    DB           /var/log/fluent-bit-aws.db

# --- Palo Alto TRAFFIC syslog (UDP listener) ---
# Listens on 0.0.0.0:5140 to accept agentless network syslog from LAN hosts/firewalls.
[INPUT]
    Name         syslog
    Mode         udp
    Port         5140
    Tag          paloalto
    Listen       0.0.0.0

# --- Windows Security Events ---
# IMPORTANT: The 'winevtlog' plugin ONLY functions when Fluent Bit runs
# natively on a Windows OS. When running CyberGuard on Debian/Linux in a dual-boot setup:
#   1. Comment out this [INPUT] block on Linux.
#   2. Use the primary baseline: export Security events via PowerShell CSV
#      (Get-WinEvent 4624/4625) and upload via Streamlit or POST to /ingest/windows.
[INPUT]
    Name         winevtlog
    Channels     Security
    Tag          windows
    Read_from_Head true
    DB           /var/log/fluent-bit-windows.db

# ============================================================
# OUTPUT: forward to CyberGuard Flask receiver on the laptop
# ============================================================

# All local sources -> localhost:5000
[OUTPUT]
    Name         http
    Match_Regex  (apache|linux|aws|paloalto|windows)
    Host         127.0.0.1
    Port         5000
    URI          /ingest/${Tag}
    Format       json
    Header       X-API-Key ${CYBERGUARD_API_KEY}
    Header       X-Host-Name laptop-siem

# ============================================================
# REMOTE MODE: runs on VMs / LAN hosts
# Copy this file to remote machine, set Host to SIEM laptop's LAN IP,
# and set X-Host-Name to the remote host's name.
# Example for a remote VM named "web-vm":
#   Host         192.168.1.10      # <- laptop's LAN IP
#   X-Host-Name  web-vm            # <- this VM's hostname
# ============================================================
# [OUTPUT]
#     Name         http
#     Match_Regex  (apache|linux|aws|paloalto|windows)
#     Host         192.168.1.10
#     Port         5000
#     URI          /ingest/${Tag}
#     Format       json
#     Header       X-API-Key ${CYBERGUARD_API_KEY}
#     Header       X-Host-Name web-vm
