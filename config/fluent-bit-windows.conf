[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

# 1. Tail Local Apache Sample Logs
[INPUT]
    Name         tail
    Tag          apache
    Path         C:\Users\ranua\Videos\Cyber-Guard\data\samples\apache_attack.log
    Read_from_Head true

# 2. Tail Local Linux Auth Sample Logs
[INPUT]
    Name         tail
    Tag          linux
    Path         C:\Users\ranua\Videos\Cyber-Guard\data\samples\linux_attack.log
    Read_from_Head true

# 3. Tail Windows Security CSV Logs
[INPUT]
    Name         tail
    Tag          windows
    Path         C:\Users\ranua\Videos\Cyber-Guard\data\samples\windows_attack.csv
    Read_from_Head true

# 4. Tail Palo Alto Firewall CSV Logs
[INPUT]
    Name         tail
    Tag          paloalto
    Path         C:\Users\ranua\Videos\Cyber-Guard\data\samples\paloalto_attack.log
    Read_from_Head true

# 5. Native Windows Event Log channel (Application and System logs)
[INPUT]
    Name         winevtlog
    Channels     Application,System
    Tag          windows.winevt
    Interval_Sec 2

# Output: HTTP POST to Cyber-Sheild SIEM Server on localhost:5000
[OUTPUT]
    Name         http
    Match        apache
    Host         127.0.0.1
    Port         5000
    URI          /ingest/apache
    Format       json
    Header       X-API-Key ${CYBERGUARD_API_KEY}
    Header       X-Host-Name windows-host

[OUTPUT]
    Name         http
    Match        linux
    Host         127.0.0.1
    Port         5000
    URI          /ingest/linux
    Format       json
    Header       X-API-Key ${CYBERGUARD_API_KEY}
    Header       X-Host-Name windows-host

[OUTPUT]
    Name         http
    Match        windows*
    Host         127.0.0.1
    Port         5000
    URI          /ingest/windows
    Format       json
    Header       X-API-Key ${CYBERGUARD_API_KEY}
    Header       X-Host-Name windows-host

[OUTPUT]
    Name         http
    Match        paloalto
    Host         127.0.0.1
    Port         5000
    URI          /ingest/paloalto
    Format       json
    Header       X-API-Key ${CYBERGUARD_API_KEY}
    Header       X-Host-Name windows-host
